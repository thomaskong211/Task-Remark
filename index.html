<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Task Manager V3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header>
  <div><div class="eyebrow">TASK MANAGER V3</div><h1>My Tasks</h1></div>
  <button class="primary" onclick="openTask()">+ New Task</button>
</header>
<main>
<section class="stats" id="stats"></section>
<section id="reminderBanner"></section>
<section class="toolbar">
  <input id="search" placeholder="Search tasks..." oninput="render()">
  <select id="filterStatus" onchange="render()"><option value="All">All Status</option><option>New</option><option>Pending</option><option>In Progress</option><option>Completed</option></select>
  <select id="filterOwner" onchange="render()"><option value="All">All Owners</option></select>
</section>
<section>
<div class="section-title"><h2>Tasks</h2><span id="taskCount"></span></div>
<div id="taskList"></div>
</section>
</main>
<nav>
<button class="active" onclick="showDashboard()">⌂<span>Dashboard</span></button>
<button onclick="showFollowups()">⏰<span>Follow-ups</span></button>
<button onclick="showHistory()">↺<span>History</span></button>
</nav>
</div>

<div class="modal" id="modal">
<div class="sheet">
<div class="sheet-head"><h2 id="modalTitle">New Task</h2><button onclick="closeModal()">✕</button></div>
<input type="hidden" id="taskId">
<label>Task Name<input id="name" placeholder="e.g. CyberArk Vendor Investigation"></label>
<label>Description<textarea id="description" placeholder="What is this task about?"></textarea></label>
<div class="grid2">
<label>Owner<select id="owner"></select></label>
<label>Priority<select id="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></label>
</div>
<div class="grid2">
<label>Start Date<input type="date" id="startDate"></label>
<label>Start Time<input type="time" id="startTime"></label>
</div>
<div class="grid2">
<label>Due Date<input type="date" id="dueDate"></label>
<label>Due Time<input type="time" id="dueTime"></label>
</div>
<label>Category<input id="category" placeholder="e.g. CyberArk / Audit / BAU"></label>
<label>Status<select id="status"><option>New</option><option>Pending</option><option>In Progress</option><option>Completed</option></select></label>
<div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveTask()">Save Task</button></div>
</div></div>

<div class="modal" id="detailModal"><div class="sheet">
<div class="sheet-head"><h2>Task Details</h2><button onclick="closeDetail()">✕</button></div>
<div id="detailContent"></div>
</div></div>

<div class="modal" id="updateModal"><div class="sheet">
<div class="sheet-head"><h2>Add Update</h2><button onclick="closeUpdate()">✕</button></div>
<p class="helper">Record what happened, who you are waiting for, and what happens next.</p>
<label>Update / Activity<textarea id="updateText" placeholder="e.g. Email sent to vendor requesting investigation."></textarea></label>
<div class="grid2">
<label>Current Status<select id="updateStatus"><option>New</option><option>Pending</option><option>In Progress</option><option>Completed</option></select></label>
<label>Waiting For<select id="waitingFor"><option>—</option><option>Vendor</option><option>User</option><option>Management</option><option>Internal Team</option><option>Other</option></select></label>
</div>
<label>Waiting For / Person<input id="waitingPerson" placeholder="Optional: CyberArk Vendor / John / Network Team"></label>
<label>Next Action<input id="nextAction" placeholder="e.g. Follow up with vendor"></label>
<div class="grid2">
<label>Next Follow-up Date<input type="date" id="followDate"></label>
<label>Next Follow-up Time<input type="time" id="followTime"></label>
</div>
<label>Update By<input id="updateBy" placeholder="Your name"></label>
<label class="check"><input type="checkbox" id="reminderEnabled" checked> Enable follow-up reminder</label>
<div class="actions"><button class="secondary" onclick="closeUpdate()">Cancel</button><button class="primary" onclick="saveUpdate()">Save Update</button></div>
</div></div>

<script src="app.js"></script>
</body>
</html>
